version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loga_erp}
      POSTGRES_USER: ${POSTGRES_USER:-loga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/migrations/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/database/migrations/002_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loga} -d ${POSTGRES_DB:-loga_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loga}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-loga_erp}
      PORT: 3001
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
      - backups:/backups
      - ./backend/assets:/app/assets
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      # El container nginx ahora corre como USER nginx → escucha 8080.
      # Mapeamos el 80 del host al 8080 del container.
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  backups:
