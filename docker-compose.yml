version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: loga_erp
      POSTGRES_USER: loga
      POSTGRES_PASSWORD: loga2026seguro
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/migrations/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/database/migrations/002_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loga -d loga_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      DATABASE_URL: postgresql://loga:loga2026seguro@db:5432/loga_erp
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: cambia-este-secreto-en-produccion-abc123
      BACKUP_PASSWORD: Loga2026
    volumes:
      - uploads:/app/uploads
      - backups:/backups
      - ./backend/assets:/app/assets
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  backups:
