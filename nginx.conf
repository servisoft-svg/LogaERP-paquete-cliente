# =============================================================
# nginx.conf — frontend SPA + reverse proxy hacia backend
# Fix #26: gzip, security headers (HSTS/CSP), rate limit zones,
# cache static, body size sensato.
# =============================================================

# Rate limit zones — definidas a nivel http (en este conf de container
# nginx alpine se carga vía /etc/nginx/conf.d/, dentro de un http{} ya
# abierto por el nginx.conf principal). Si necesitas declarar zones,
# ponlas en un fichero http.d/ o en el nginx.conf raíz.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=2r/s;

# Compresión gzip
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
  text/plain text/css text/xml text/javascript
  application/json application/javascript application/xml+rss application/atom+xml
  image/svg+xml font/ttf font/otf font/eot application/font-woff application/font-woff2;

server {
    # USER nginx no puede bind a <1024 sin CAP_NET_BIND_SERVICE.
    # Container escucha 8080; docker-compose mapea host:80 → container:8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defensa en profundidad — Helmet en backend ya pone HSTS/CSP)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Server tokens off — no revelar versión nginx
    server_tokens off;

    # Cache largo para assets versionados (Vite añade hash al nombre)
    location ~* \.(js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Frontend SPA — todas las rutas van a index.html (sin cache para HTML)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Login: rate limit estricto (anti brute-force complementa al limiter del backend)
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy al backend
    location /api/ {
        limit_req zone=api_zone burst=30 nodelay;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 20M;
    }

    # Uploads proxy (auth handled in backend uploadsAuthMiddleware Fix #6)
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # Health check
    location /health {
        access_log off;
        proxy_pass http://backend:3001;
    }
}
